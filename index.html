:root{--bg:#f3ebe0;--ink:#1c1b19;--card:#fffaf3;--acc:#d9c7f2}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Neucha,"Trebuchet MS",sans-serif;padding:2vh 3vw;display:flex;flex-direction:column;gap:2vh;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,.big{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:.95}
.btn{border:3px solid var(--ink);background:var(--card);border-radius:999px;padding:1vh 2vw;font-size:clamp(16px,2.6vh,26px)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.3;cursor:default}
.link{border:none;background:none;text-decoration:underline;opacity:.7;font-size:clamp(14px,2.2vh,22px);padding:1vh 1vw}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:3vw}
header h1{font-size:clamp(28px,6.4vh,70px)}
.bank{text-align:right;line-height:1}
.bank small{display:block;font-size:clamp(13px,2.2vh,22px);opacity:.7;margin-bottom:.4vh}
.bank b{font-family:Oswald,Impact,sans-serif;font-size:clamp(38px,9vh,100px);font-weight:700}
main{flex:1;display:flex;flex-direction:column}
.scr{display:none}.scr.on{display:grid}
.dot{display:inline-block;width:1em;height:1em;border-radius:50%;border:2px solid var(--ink);vertical-align:-.12em;margin-right:.4em}
/* setup */
#setup{grid-template-columns:1fr 1fr;gap:3vw;align-content:start}
h2{font-family:Oswald,sans-serif;font-size:clamp(20px,3.6vh,36px);text-transform:uppercase;margin-bottom:1vh}
.names{display:grid;grid-template-columns:1fr 1fr;gap:1vh 1vw}
input{font:inherit;font-size:clamp(16px,2.4vh,24px);padding:1vh 1vw;border:3px solid var(--ink);border-radius:14px;background:var(--card);width:100%}
.fld{display:flex;flex-direction:column;gap:.6vh;margin-bottom:1.6vh}
.fld label{font-size:clamp(14px,2.2vh,22px);opacity:.75}
.row{display:flex;gap:1vw;align-items:center;flex-wrap:wrap}
/* play */
#play{grid-template-columns:1.4fr 1fr;gap:1.6vh 3vw;flex:1;grid-template-rows:auto 1fr}
.strip{grid-column:1/-1;display:flex;gap:.7vw}
.strip i{flex:1;height:clamp(12px,2.2vh,22px);border-radius:999px;border:2px solid var(--ink);background:transparent}
.strip i.cur{border-width:4px}
.strip i.no{background:repeating-linear-gradient(45deg,transparent 0 4px,#bbb 4px 6px)}
.lotbox{position:relative;overflow:hidden;border:4px solid var(--ink);border-radius:30px;background:var(--card);padding:3vh 2.4vw;display:flex;flex-direction:column;justify-content:space-between;gap:2vh}
.lotbox>*{position:relative;z-index:1}
.lotbox .bignum{position:absolute;right:-1.5vw;top:-6vh;z-index:0;font-family:Oswald,sans-serif;font-weight:700;font-size:clamp(180px,52vh,560px);line-height:1;color:var(--acc);pointer-events:none}
.lotbox.shake{animation:shake .35s .28s}
@keyframes shake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(3px,-1px)}}
.stamp{position:absolute;left:50%;top:52%;z-index:5!important;padding:.15em .7em;border:.7vh solid var(--ink);border-radius:20px;font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(40px,13vh,150px);line-height:1.05;box-shadow:0 0 0 .8vh var(--card);transform:translate(-50%,-50%) rotate(-9deg);animation:stamp .3s cubic-bezier(.2,1.5,.4,1) both;pointer-events:none;white-space:nowrap}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-22deg) scale(2.8);opacity:0}to{transform:translate(-50%,-50%) rotate(-9deg) scale(1);opacity:1}}
.lotno{font-family:Oswald,sans-serif;font-weight:500;font-size:clamp(16px,2.6vh,28px);letter-spacing:.14em;text-transform:uppercase;border-bottom:3px solid var(--ink);padding-bottom:1vh}
.lottitle{font-size:clamp(34px,10vh,120px);overflow-wrap:anywhere}
.pricerow{border-top:3px solid var(--ink);padding-top:1.6vh;display:flex;align-items:center;gap:1vw;font-family:Oswald,sans-serif;font-size:clamp(20px,4vh,44px)}
.pricerow b{background:var(--acc);padding:0 .6em;border-radius:12px;min-width:2em;text-align:center}
.rb{width:clamp(40px,6vh,64px);height:clamp(40px,6vh,64px);border-radius:50%;border:3px solid var(--ink);background:var(--bg);font-family:Oswald,sans-serif;font-size:clamp(20px,3.4vh,34px);line-height:1}
.side{display:flex;flex-direction:column;gap:1.2vh}
.pl{border:3px solid var(--ink);border-radius:20px;padding:1.2vh 1vw;background:var(--card);display:grid;grid-template-columns:1fr auto;gap:.3vh .6vw;align-items:center;text-align:left;width:100%}
.pl.sel{background:var(--acc);border-width:5px}
.pl .nm{font-size:clamp(17px,2.8vh,28px)}
.pl .c{font-family:Oswald,sans-serif;font-weight:700;font-size:clamp(26px,4.6vh,48px);line-height:1}
.pl .lots{grid-column:1/3;display:flex;gap:.4vw;flex-wrap:wrap}
.chip{font-family:Oswald,sans-serif;font-size:clamp(12px,2vh,20px);background:var(--ink);color:var(--bg);border-radius:999px;padding:0 .7em;line-height:1.5}
.msg{min-height:1.4em;font-size:clamp(14px,2.2vh,22px);color:#b3261e}
.foot{display:flex;gap:1vw;align-items:center;flex-wrap:wrap}
/* end */
.rcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:2.4vh 1.6vw}
.rc{--r:-1deg;background:#fff;font-family:"Courier New",Courier,monospace;padding:1.8vh 1.2vw 2.4vh;position:relative;font-size:clamp(13px,2vh,19px);transform:rotate(var(--r));margin-bottom:8px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.rc:nth-child(even){--r:.8deg}
.rc:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:radial-gradient(circle at 6px -2px,transparent 6px,#fff 6.5px) repeat-x;background-size:12px 8px}
.rc h4{font-family:"Courier New",monospace;font-size:1.15em;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.6vh}
.rc .ln{display:flex;gap:.4em;align-items:baseline}
.rc .ln .d{flex:1;border-bottom:2px dotted #999}
.rc hr{border:none;border-top:2px dashed #999;margin:.8vh 0}
.rc .tot{font-weight:bold}
.rcnote{margin-top:2.4vh;font-size:clamp(14px,2.2vh,22px)}
#end{grid-template-columns:1.3fr 1fr;gap:3vw;align-content:start}
table{border-collapse:collapse;width:100%;font-size:clamp(15px,2.4vh,24px)}
td,th{border-bottom:2px solid var(--ink);padding:.6vh .5vw;text-align:left;vertical-align:top}
th{font-family:Oswald,sans-serif;text-transform:uppercase;font-weight:500}
.q{border:4px solid var(--ink);border-radius:26px;background:var(--card);padding:2.4vh 2vw;display:flex;flex-direction:column;justify-content:space-between;gap:2vh;min-height:30vh}
.q .t{font-size:clamp(22px,5vh,52px)}
.q .qq{font-size:clamp(20px,4vh,42px);line-height:1.15}
@media(max-width:800px) and (orientation:portrait){
 body{padding:2vh 5vw;gap:1.6vh}
 header h1{font-size:9vw}.bank b{font-size:13vw}.bank small{font-size:3.6vw}
 #setup,#play,#end{grid-template-columns:1fr;gap:2vh}
 .lotbox{padding:2.4vh 5vw;border-radius:24px}
 .lottitle{font-size:11vw}
 .lotno{font-size:4vw}
 .pricerow{font-size:7vw}.rb{width:11vw;height:11vw;font-size:6vw}
 .btn{font-size:4.6vw;padding:1.4vh 5vw}
 .link{font-size:4vw}
 .pl{padding:1.2vh 3.4vw}.pl .nm{font-size:4.6vw}.pl .c{font-size:8vw}.chip{font-size:3.4vw}
 .side{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 3vw}
 .side .full{grid-column:1/3}
 .names{grid-template-columns:1fr}input{font-size:4.8vw;padding:1.2vh 3vw}.fld label{font-size:4vw}
 h2{font-size:6vw}
 .lotbox .bignum{font-size:62vw;top:-4vh;right:-4vw}.stamp{font-size:15vw}.rc{font-size:3.8vw;padding:2vh 4vw 2.6vh}
 .q .t{font-size:8vw}.q .qq{font-size:5.6vw}td,th{font-size:4.2vw}.msg{font-size:3.8vw}
}
</style></head><body>
<header><h1>Аукцион<br>ценностей</h1><div class="bank"><small>Банк группы</small><b id="bank">0</b></div></header>
<main>
 <section class="scr on" id="setup">
  <div>
   <div class="row" style="margin-bottom:1.6vh"><button class="btn dark" id="mP">Игроки</button><button class="btn" id="mT">Команды</button></div>
   <h2 id="h2n">Игроки</h2>
   <div class="names" id="names"></div>
  </div>
  <div>
   <div class="fld"><label id="cntl">Сколько игроков</label>
    <div class="row"><button class="rb" id="pm">−</button><b class="big" id="pn" style="font-size:clamp(30px,6vh,60px)">6</b><button class="rb" id="pp">+</button></div></div>
   <div class="fld"><label id="coinl">Токенов у каждого игрока</label><input id="coins" type="number" min="1" max="100" value="10" inputmode="numeric"></div>
   <div class="fld"><label>Цена лота (от)</label><input id="start" type="number" min="1" max="50" value="3" inputmode="numeric"></div>
   <button class="btn dark" id="go">Начать аукцион</button>
  </div>
 </section>

 <section class="scr" id="play">
  <div class="strip" id="strip"></div>
  <div class="lotbox" id="lotbox">
   <div class="bignum" id="bn"></div>
   <div class="lotno" id="lotno"></div>
   <div class="big lottitle" id="lottitle"></div>
   <div class="pricerow">Цена <button class="rb" id="pm1">−</button><b id="pv">3</b><button class="rb" id="pp1">+</button></div>
  </div>
  <div class="side" id="side"></div>
 </section>

 <section class="scr" id="end">
  <div>
   <h2>Итоги</h2>
   <div class="rcs" id="rcs"></div><div class="rcnote" id="rcn"></div>
   <div class="row" style="margin-top:2vh"><button class="btn" id="again">Новая игра</button></div>
  </div>
  <div>
   <h2>Разговор</h2>
   <div class="q"><div><div class="lotno" id="qno"></div><div class="big t" id="qt"></div></div><div class="qq" id="qq"></div>
    <div class="row"><button class="btn" id="qprev">Назад</button><button class="btn dark" id="qnext">Дальше</button></div></div>
  </div>
 </section>
</main>

<script>
const LOTS=[
 ["Читать мысли всех людей","Ты хочешь знать, что на самом деле думают о тебе близкие?"],
 ["Знать своё будущее","Если бы ты знал всё заранее, стал бы ты что-то менять?"],
 ["Робот, который делает за тебя всё","Что останется твоим, если всё делает робот?"],
 ["Цифровая копия тебя","Копия живёт и решает как ты. Кто из вас настоящий?"],
 ["Никогда не ошибаться","Если ИИ подсказывает каждый шаг, чья это жизнь?"],
 ["Помнить всё","Каждое слово, каждую обиду. Что ты хотел бы забыть?"],
 ["ИИ управляет миром вместо людей: без войн, голода и болезней","Все решения принимает он. Кто должен решать за людей?"]
];
const SHORT=["Мысли","Будущее","Робот","Копия","Без ошибок","Память","ИИ у власти"];
const GEN="Что вы купили и зачем? Что бы вы сделали иначе, если начать игру заново?";
const COL=['#f4a6b8','#f7c98b','#b7d9a8','#a8cfe6','#c9b3e6','#f3e08a','#e8908a','#9fd8d0','#d8b48a','#b0b0b0'];
const dot=k=>'<i class="dot" style="background:'+COL[k%COL.length]+'"></i>';
const $=s=>document.querySelector(s),KEY='aukcion2';
let S=null,hist=[],qi=0,np=6,mode='P',sel=new Set(),price=3,priceFor=-1,anim=null,pool=false;
const colOf=ks=>ks.length===1?COL[ks[0]%COL.length]:'linear-gradient(90deg,'+ks.map((k,j)=>COL[k%COL.length]+' '+(j*100/ks.length)+'% '+((j+1)*100/ks.length)+'%').join(',')+')';
const U=()=>(S&&S.mode||mode)==='T'?'Команда':'Игрок';
const bank=()=>S?S.players.reduce((a,p)=>a+p.coins,0):0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,hist}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.S){S=d.S;hist=d.hist||[]}}catch(e){}}
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id))}
function setMode(m,keep){mode=m;if(!keep){np=m==='T'?3:6;$('#coins').value=m==='T'?20:10}
 $('#mP').classList.toggle('dark',m==='P');$('#mT').classList.toggle('dark',m==='T');
 $('#h2n').textContent=m==='T'?'Команды':'Игроки';
 $('#cntl').textContent=m==='T'?'Сколько команд':'Сколько игроков';
 $('#coinl').textContent=m==='T'?'Токенов у каждой команды':'Токенов у каждого игрока';
 $('#names').innerHTML='';names()}
function names(){const box=$('#names'),old=[...box.querySelectorAll('input')].map(i=>i.value);box.innerHTML='';
 for(let i=0;i<np;i++){const x=document.createElement('input');x.placeholder=U()+' '+(i+1);x.value=old[i]||'';box.appendChild(x)}
 $('#pn').textContent=np}
$('#mP').onclick=()=>setMode('P');$('#mT').onclick=()=>setMode('T');
$('#pm').onclick=()=>{if(np>2){np--;names()}};
$('#pp').onclick=()=>{if(np<(mode==='T'?8:10)){np++;names()}};
$('#go').onclick=()=>{
 const c=Math.max(1,+$('#coins').value||10);
 const pl=[...$('#names').querySelectorAll('input')].map((x,i)=>({name:x.value.trim()||U()+' '+(i+1),coins:c,lots:[]}));
 S={mode,players:pl,start:Math.max(1,+$('#start').value||3),i:0,log:[]};
 hist=[];priceFor=-1;save();render()};
function render(){
 $('#bank').textContent=bank();
 if(!S){show('setup');return}
 if(S.i>=LOTS.length&&!anim){show('end');renderEnd();return}
 show('play');
 const i=anim?anim.lot:S.i;
 if(priceFor!==i&&!anim){priceFor=i;price=S.start;sel=new Set();pool=false}
 $('#lotno').textContent='Лот '+String(i+1).padStart(2,'0')+' / '+String(LOTS.length).padStart(2,'0');
 $('#bn').textContent=String(i+1).padStart(2,'0');
 $('#lottitle').textContent=LOTS[i][0];
 $('#pv').textContent=anim?anim.price:price;
 const lb=$('#lotbox');lb.classList.remove('shake');
 lb.querySelectorAll('.stamp').forEach(e=>e.remove());
 if(anim){const st=document.createElement('div');st.className='stamp';st.textContent='Куплено';st.style.background=colOf(anim.teams);lb.appendChild(st);void lb.offsetWidth;lb.classList.add('shake')}
 const sp=$('#strip');sp.innerHTML='';
 LOTS.forEach((_,j)=>{const e=document.createElement('i');const lg=S.log.find(l=>l.lot===j+1);
  if(lg&&lg.ok&&lg.t){e.style.background=colOf(lg.t)}else if(lg&&!lg.ok){e.className='no'}
  if(j===S.i&&!anim)e.classList.add('cur');sp.appendChild(e)});
 const side=$('#side');side.innerHTML='';
 S.players.forEach((p,k)=>{const d=document.createElement('button');d.className='pl'+(sel.has(k)?' sel':'');
  d.innerHTML='<span class="nm">'+dot(k)+'<span></span></span><span class="c">'+p.coins+'</span><div class="lots">'+p.lots.map(n=>'<span class="chip">'+SHORT[n-1]+'</span>').join('')+'</div>';
  d.querySelector('.nm span').textContent=p.name;
  d.disabled=!!anim;
  d.onclick=()=>{pool=false;sel.has(k)?sel.delete(k):sel.add(k);render()};
  side.appendChild(d)});
 const share=sel.size?Math.ceil(price/sel.size):0;
 const poor=pool?(bank()<price?['все вместе']:[]):[...sel].filter(k=>S.players[k].coins<share).map(k=>S.players[k].name);
 const m=document.createElement('div');m.className='msg full';m.textContent=pool?(poor.length?'В общем банке '+bank()+', не хватает до '+price:'Общий банк: '+bank()+'. Платим вместе.'):(poor.length?'Не хватает токенов: '+poor.join(', '):(sel.size>1?'Каждый платит по '+share:''));
 if(!poor.length)m.style.color='var(--ink)';
 side.appendChild(m);
 const f=document.createElement('div');f.className='foot full';
 f.innerHTML='<button class="btn dark" id="sold">Куплено</button><button class="link" id="skip">Не продан</button><button class="link" id="back">Назад</button>'+(i===LOTS.length-1?'<button class="btn'+(pool?' dark':'')+'" id="pool">Объединить банк</button>':'');
 side.appendChild(f);
 $('#sold').disabled=anim||!sel.size||poor.length>0;
 $('#skip').disabled=!!anim;$('#back').disabled=!!anim;
 if($('#pool'))$('#pool').onclick=()=>{pool=!pool;sel=pool?new Set(S.players.map((_,k)=>k)):new Set();render()};
 $('#sold').disabled=anim||!sel.size||poor.length>0;
 $('#sold').onclick=sell;$('#skip').onclick=skip;$('#back').onclick=back;
}
$('#pm1').onclick=()=>{if(!anim){price=Math.max(1,price-1);render()}};
$('#pp1').onclick=()=>{if(!anim){price++;render()}};
function sell(){hist.push(JSON.stringify(S));const ks=[...sel].sort((a,b)=>a-b);
 let paid=ks.map(()=>0);
 if(pool){let need=price;while(need>0){let m=-1;ks.forEach((k,j)=>{if(S.players[k].coins-paid[j]>0&&(m<0||S.players[k].coins-paid[j]>S.players[ks[m]].coins-paid[m]))m=j});if(m<0)break;paid[m]++;need--}}
 else{const sh=Math.ceil(price/sel.size);paid=ks.map(()=>sh)}
 ks.forEach((k,j)=>{const p=S.players[k];p.coins-=paid[j];p.lots.push(S.i+1);(p.pay=p.pay||[]).push(paid[j])});
 S.log.push({lot:S.i+1,ok:true,t:ks,pool});
 anim={lot:S.i,teams:ks,price};S.i++;save();render();
 try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
 setTimeout(()=>{anim=null;render()},1100)}
function skip(){hist.push(JSON.stringify(S));S.log.push({lot:S.i+1,ok:false});S.i++;save();render()}
function back(){if(hist.length){S=JSON.parse(hist.pop());priceFor=-1;save();render()}
 else if(confirm('Вернуться к настройкам?')){S=null;try{localStorage.removeItem(KEY)}catch(e){};priceFor=-1;render()}}
function renderEnd(){
 const box=$('#rcs');box.innerHTML='';
 S.players.forEach((p,k)=>{const c=document.createElement('div');c.className='rc';
  let h='<h4>'+dot(k)+'<span></span></h4><hr>';
  p.lots.forEach((n,j)=>{h+='<div class="ln"><span>'+SHORT[n-1]+'</span><span class="d"></span><span>-'+((p.pay&&p.pay[j])||'')+'</span></div>'});
  if(!p.lots.length)h+='<div class="ln"><span>ничего не куплено</span></div>';
  h+='<hr><div class="ln tot"><span>ОСТАТОК</span><span class="d"></span><span>'+p.coins+'</span></div>';
  c.innerHTML=h;c.querySelector('h4 span').textContent=p.name;box.appendChild(c)});
 const un=S.log.filter(l=>!l.ok).map(l=>SHORT[l.lot-1]);
 $('#rcn').textContent='В банке осталось: '+bank()+(un.length?'. Не куплены: '+un.join(', ')+'.':'.');
 qi=0;drawQ()}
function drawQ(){const n=LOTS.length;
 if(qi<n){$('#qno').textContent='Лот '+(qi+1);$('#qt').textContent=LOTS[qi][0];$('#qq').textContent=LOTS[qi][1]}
 else{$('#qno').textContent='Итог';$('#qt').textContent='Игра';$('#qq').textContent=GEN}
 $('#qprev').disabled=qi===0;$('#qnext').disabled=qi===n}
$('#qprev').onclick=()=>{if(qi>0){qi--;drawQ()}};
$('#qnext').onclick=()=>{if(qi<LOTS.length){qi++;drawQ()}};
$('#again').onclick=()=>{S=null;hist=[];priceFor=-1;try{localStorage.removeItem(KEY)}catch(e){};setMode('P');render()};
load();
if(S){mode=S.mode||'P';np=S.players.length;setMode(mode,true);[...$('#names').querySelectorAll('input')].forEach((x,i)=>x.value=S.players[i].name)}else setMode('P');
render();
</script></body></html>
